name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_STACKS_NETWORK: testnet
      NEXT_PUBLIC_CONTRACT: ST000000000000000000002AMW42H.thread-pay
      NEXT_PUBLIC_APP_DOMAIN: example.com
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-dummy-service-role-key
      AUTH_SESSION_SECRET: ci-dummy-session-secret-0000000000000000
      LLM_PROVIDER: ollama
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Install Clarinet
        run: |
          curl -fsSL https://github.com/hirosystems/clarinet/releases/download/v3.14.1/clarinet-linux-x64-glibc.tar.gz -o /tmp/clarinet.tar.gz
          tar -xzf /tmp/clarinet.tar.gz -C /tmp
          sudo mv /tmp/clarinet /usr/local/bin/clarinet
          clarinet --version
      - run: clarinet check
